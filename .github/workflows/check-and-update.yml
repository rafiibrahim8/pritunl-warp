name: Check and Update Version

# Dispatch-only: GitHub disables scheduled workflows after 60 days of
# repository inactivity, and this repo is quiet by design — it only commits
# when upstream publishes a release. An external scheduler dispatches it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT rather than GITHUB_TOKEN, so the resulting push triggers
          # build.yml. Pushes made with GITHUB_TOKEN do not start workflows.
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Get latest upstream and local version
        id: checks
        run: |
          upstream_tag=$(curl -sSL -H 'accept: application/vnd.github+json' \
            https://api.github.com/repos/pritunl/pritunl/releases/latest | jq -r '.tag_name // empty')

          # `jq -r .tag_name` prints the 4-character string "null" when the
          # field is absent — a rate limit or an error body — and an emptiness
          # test does not catch that. Once "null" reached the README it stuck,
          # because the replacement below only matches a real version. So the
          # shape is checked before anything is written.
          if ! printf '%s' "$upstream_tag" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Refusing to continue: upstream tag is '$upstream_tag', which is not a version."
            exit 1
          fi

          local_version=$(cat stable/VERSION)
          formatted_date=$(date -u +"%Y-%m-%d %H:%M (UTC)")
          echo "Current datetime in UTC: $formatted_date"
          echo "Latest upstream tag: $upstream_tag"
          echo "Current local version: $local_version"
          {
            echo "upstream_tag=$upstream_tag"
            echo "local_version=$local_version"
            echo "formatted_date=$formatted_date"
          } >> "$GITHUB_OUTPUT"

      - name: Update files
        if: steps.checks.outputs.upstream_tag != steps.checks.outputs.local_version
        env:
          UPSTREAM_TAG: ${{ steps.checks.outputs.upstream_tag }}
          FORMATTED_DATE: ${{ steps.checks.outputs.formatted_date }}
        run: |
          printf '%s\n' "$UPSTREAM_TAG" > stable/VERSION

          # Anchored on the table's link structure, not on the shape of the
          # value being replaced, so a bad version can always be corrected on
          # the next run instead of persisting forever.
          sed -i -E \
            -e "s#(/pritunl/releases/tag/)[^)]*#\1${UPSTREAM_TAG}#" \
            -e "s#\[v[^]]*\]\((https://github\.com/pritunl/pritunl/releases)#[v${UPSTREAM_TAG}](\1#" \
            README.md

          sed -i -E \
            "0,/[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]+[0-9]{2}:[0-9]{2}[[:space:]]+\(UTC\)/s##${FORMATTED_DATE}#" \
            README.md

          # The README is the thing that broke last time, so it is verified
          # here rather than after the fact.
          if ! grep -qF "[v${UPSTREAM_TAG}](https://github.com/pritunl/pritunl/releases/tag/${UPSTREAM_TAG})" README.md; then
            echo "README version cell did not update as expected:"
            grep -n '^| \[latest\]' README.md
            exit 1
          fi

      - name: Commit and push changes
        if: steps.checks.outputs.upstream_tag != steps.checks.outputs.local_version
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: 'Update version to ${{ steps.checks.outputs.upstream_tag }}'
